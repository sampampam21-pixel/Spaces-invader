<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spaces Invader</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-wrapper">
    <!-- Three.js synthwave background -->
    <canvas id="three-canvas"></canvas>
    <!-- Phaser game canvas (transparent bg) -->
    <div id="phaser-container"></div>
    <!-- CRT vignette -->
    <div id="crt-overlay"></div>
    <!-- Scanlines -->
    <div id="scanlines"></div>
  </div>

  <!-- Libraries from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>

  <!-- Game source (order matters: config first, then classes, then boot) -->
  <script src="js/config.js"></script>
  <script src="js/three-background.js"></script>
  <script src="js/scenes/PreloadScene.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/UIScene.js"></script>
  <script src="js/scenes/GameOverScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
